[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hockey-pace-explorer"
version = "0.1.0"
description = "Hockey Pace Explorer full-stack application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jupyterlab>=4.3",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic-settings>=2.6",
  "scikit-learn>=1.6",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx2>=1.0",
  "nbconvert>=7.16",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
